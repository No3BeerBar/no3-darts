# Copy to config.yaml and edit for your bar mini-PC.
# Autodarts detects throws; No3 runs game modes / scoring UI.
# Prefer tools/board-station/config.yaml for the one-script board stack.

autodarts:
  host: "127.0.0.1"   # PC running Autodarts Board Manager
  port: 3180          # default Board Manager port
  poll_ms: 300        # how often to poll /api/state (~300ms is typical)
  # Editable install path (used for health auto-restart). Leave blank to skip Start.
  # Example: "C:\\Program Files\\Autodarts\\Autodarts.exe"
  exe_path: ""
  # Autodarts board UUID from Board Manager Config (Board1 only).
  # Leave blank on a one-board mini-PC. If more than one board is visible,
  # keep-alive will not start any board until this id is set.
  board_id: ""
  process_names:
    - "Autodarts"
    - "autodarts"
    - "AutodartsDesktop"

no3:
  # Required for `bridge` (and optional for `compare`)
  url: "https://no3-darts-production.up.railway.app"
  room_id: "Board 1"
  # Same value as CAMERA_API_KEY on Railway (leave blank if unset)
  camera_api_key: ""

health:
  enabled: true
  fps_min: 5.0                 # treat below this as unhealthy when FPS is exposed
  unhealthy_seconds: 15.0      # how long degraded before restart attempt
  restart_cooldown_seconds: 60.0
  # Probe Board Manager reset/calibrate only at No3 game boundaries
  # (no playing/paused match) when the board is empty - not every visit takeout.
  between_games_recal: true

# While the companion is running, start this board if Board Manager stopped it
# (idle timer or leftover Stop). Quitting the companion stops the loop.
keep_alive:
  enabled: true
  interval_s: 10.0
  # Same as autodarts.board_id when set here
  board_id: ""

logs_dir: "./logs"
